<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Bidones</title>
    <link rel="icon" type="image/jpg" href="index/1.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        /* Mantenemos tu CSS original */
        body { margin: 0; padding: 0; background-color: black; color: white; font-family: Arial, sans-serif; background-image: url('index/cGVn.webp'); }
        #container { max-width: 1500px; margin: 0 auto; padding: 20px; }
        #image-gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
        .image-card { width: calc(30% - 10px); margin-bottom: 10px; border: 3px solid black; border-radius: 5px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.3s; background-color: black; }
        .image-card:hover { transform: scale(1.1); }
        .zoomed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .zoomed img { max-width: 90%; max-height: 90%; border: 2px solid white; border-radius: 5px; }
        #Siguiente { position: fixed; bottom: 20px; right: 30px; width: 40px; background-color: rgb(68, 164, 196); padding: 10px; border: none; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; }
        #buscadorHeader { visibility: hidden; }
        .t-color { color: green; }
        
        /* Ajustes Mobile */
        @media (max-width: 768px) { .image-card { width: calc(50% - 10px); } }
        @media (max-width: 480px) { .image-card { width: 100%; } }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg " style="background-color: rgb(44, 44, 44);">
        <div class="container-fluid">
            <a class="navbar-brand"><img src="index/1.png" style="width:100px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" style="border-color: white;">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav mx-auto text-center">
                    <li class="nav-item"><a class="nav-link t-color" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link t-color" href="bolsas.html">Bolsas</a></li>
                    <li class="nav-item"><a class="nav-link active t-color" style="color: white;" href="bidones.html">Bidones</a></li>
                </ul>

                <div id="buscadorHeader">
                    <form id="fbHeader" class="d-flex" role="search" onsubmit="return false;">
                        <input class="form-control me-2" type="search" placeholder="Equipo / año" id="buscador">
                        <button class="btn btn-outline-success" type="button" onclick="recogervalor()">Search</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div id="container">
        <div id="image-gallery"></div>
    </div>

    <button onclick="scrollToTop()" id="Siguiente" title="Ir arriba">↑</button>

    <div class="zoomed" id="zoomedContainer">
        <img id="zoomedImage" alt="Imagen Ampliada" src="">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/generarimagenesBidones.js"></script>
    <script src="js/botonariba.js"></script>

    <script>
        // Esta función espera a que TODOS los scripts externos (como generarimagenesBidones.js) estén cargados
        window.addEventListener('load', function() {
            if (typeof recogervalor === 'function') {
                visualizarBucadores();
                recogervalor(); 
            } else {
                console.error("Error: El archivo JS de bidones no se cargó correctamente.");
            }
        });
    </script>
</body>
</html>
